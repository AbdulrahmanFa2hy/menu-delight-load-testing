name: Distributed Multi-Experience Load Test

on:
  workflow_dispatch:
    inputs:
      target_vus:
        description: Total virtual users (larger stages require verified runner capacity)
        required: true
        default: '100'
        type: choice
        options: ['100', '250', '500', '1000', '2000', '3000', '5000', '7500', '10000']
      duration_seconds:
        description: Hold duration in seconds
        required: true
        default: '60'
        type: choice
        options: ['30', '60', '120', '300']
      workload_mode:
        description: Mixed capacity workload or isolated diagnostic workload
        required: true
        default: mixed
        type: choice
        options: [mixed, tracking, games]
      backend_route:
        description: Normal public path or TLS-verified backend origin diagnostic
        required: true
        default: cloudflare
        type: choice
        options: [cloudflare, backend_origin]
      connections:
        description: Normal reuse or diagnostic fresh connection per iteration
        required: true
        default: keepalive
        type: choice
        options: [keepalive, fresh_iteration]
      diagnostic_capture:
        description: Capture sanitized correlation records (maximum 1000 total VUs)
        required: true
        default: false
        type: boolean
      workers_request_budget:
        description: Available Workers requests reserved for this run after checking account usage (0 blocks asset workloads)
        required: true
        default: '0'
        type: string
      workers_budget_verified_at:
        description: UTC verification time within the last 15 minutes, for example YYYY-MM-DDTHH:mm:ssZ
        required: false
        default: ''
        type: string

permissions:
  contents: read
concurrency:
  group: vps-benchmark
  cancel-in-progress: false

jobs:
  prepare-capacity:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      nodes: ${{ steps.plan.outputs.nodes }}
      peak_vus: ${{ steps.plan.outputs.peak_vus }}
      start_ms: ${{ steps.plan.outputs.start_ms }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
      - name: Validate capacity and plan generators
        id: plan
        env:
          TOTAL_VUS: ${{ inputs.target_vus }}
          AVAILABLE_RUNNER_CAPACITY: ${{ vars.BENCHMARK_AVAILABLE_RUNNER_CAPACITY || '10' }}
          DIAGNOSTIC_CAPTURE: ${{ inputs.diagnostic_capture }}
          DURATION_SECONDS: ${{ inputs.duration_seconds }}
          WORKLOAD_MODE: ${{ inputs.workload_mode }}
          WORKERS_REQUEST_BUDGET: ${{ inputs.workers_request_budget }}
          WORKERS_BUDGET_VERIFIED_AT: ${{ inputs.workers_budget_verified_at }}
        run: |
          node --test contracts.test.mjs
          node capacity-plan.mjs
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: capacity-plan
          path: capacity-plan.json
          retention-days: 7

  distributed-load-test:
    needs: prepare-capacity
    if: github.ref == 'refs/heads/main'
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      actions: read
    env:
      PEAK_VUS: ${{ needs.prepare-capacity.outputs.peak_vus }}
      EXPECTED_NODES: ${{ needs.prepare-capacity.outputs.nodes }}
      RUN_START_MS: ${{ needs.prepare-capacity.outputs.start_ms }}
    strategy:
      fail-fast: false
      max-parallel: 100
      matrix: ${{ fromJSON(needs.prepare-capacity.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
      - name: Validate benchmark contracts
        run: |
          node --test contracts.test.mjs
          python3 -m unittest test_generator_resets.py
      - uses: grafana/setup-k6-action@43b9fc21641a76002687994433dd586f56e791b1 # v1
        with:
          k6-version: '1.3.0'
      - name: Prepare private fixture credentials
        env:
          TRACKING_TOKEN_1: ${{ secrets.TRACKING_TOKEN_1 }}
          TRACKING_TOKEN_2: ${{ secrets.TRACKING_TOKEN_2 }}
          TRACKING_TOKEN_3: ${{ secrets.TRACKING_TOKEN_3 }}
          TRACKING_TOKEN_4: ${{ secrets.TRACKING_TOKEN_4 }}
          TRACKING_TOKEN_5: ${{ secrets.TRACKING_TOKEN_5 }}
          TRACKING_TOKEN_6: ${{ secrets.TRACKING_TOKEN_6 }}
          TRACKING_TOKEN_7: ${{ secrets.TRACKING_TOKEN_7 }}
          TRACKING_TOKEN_8: ${{ secrets.TRACKING_TOKEN_8 }}
          TRACKING_TOKEN_9: ${{ secrets.TRACKING_TOKEN_9 }}
          TRACKING_TOKEN_10: ${{ secrets.TRACKING_TOKEN_10 }}
        run: node prepare-fixtures.mjs
      - name: Measure generator network
        env:
          RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: node generator-network.mjs
      - name: Synchronize generators
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node synchronize-generators.mjs
      - name: Start generator resource capture
        run: |
          python3 monitor-generator.py "$RUNNER_TEMP/generator-samples.jsonl" >"$RUNNER_TEMP/generator-monitor.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/generator-monitor.pid"
      - name: Start TCP reset metadata capture
        if: inputs.diagnostic_capture
        env:
          RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          sudo -n python3 capture-generator-resets.py "$RUNNER_TEMP/generator-resets.jsonl" "$RUN_ID" >"$RUNNER_TEMP/generator-resets-monitor.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/generator-resets.pid"
      - name: Run benchmark
        env:
          ANON_KEY: ${{ secrets.BENCHMARK_ANON_KEY }}
          DURATION_SECONDS: ${{ inputs.duration_seconds }}
          NODE_INDEX: ${{ matrix.node }}
          RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          WORKLOAD_MODE: ${{ inputs.workload_mode }}
          BACKEND_ROUTE: ${{ inputs.backend_route }}
          CONNECTIONS: ${{ inputs.connections }}
          DIAGNOSTIC_CAPTURE: ${{ inputs.diagnostic_capture }}
          ORIGIN_ADDRESS: ${{ secrets.BENCHMARK_ORIGIN_ADDRESS }}
        run: |
          umask 077
          if [[ "$DIAGNOSTIC_CAPTURE" == true ]]; then
            k6 run --quiet --log-output=none --out "json=$RUNNER_TEMP/benchmark-private-metrics.json" k6-multi-experience.mjs
          else
            k6 run --quiet --log-output=none k6-multi-experience.mjs
          fi
      - name: Stop resource capture and sanitize diagnostics
        if: always()
        env:
          NODE_INDEX: ${{ matrix.node }}
        run: |
          node collect-diagnostics.mjs
          if [[ -f "$RUNNER_TEMP/generator-samples.jsonl" ]]; then
            cp -- "$RUNNER_TEMP/generator-samples.jsonl" "generator-samples-node-$NODE_INDEX.jsonl"
          fi
          if [[ -f "$RUNNER_TEMP/generator-resets.jsonl" ]]; then
            cp -- "$RUNNER_TEMP/generator-resets.jsonl" "generator-resets-node-$NODE_INDEX.jsonl"
          fi
      - name: Upload metrics only
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: summary-node-${{ matrix.node }}
          path: |
            summary-node-${{ matrix.node }}.json
            diagnostics-node-${{ matrix.node }}.json
            generator-samples-node-${{ matrix.node }}.jsonl
            generator-resets-node-${{ matrix.node }}.jsonl
          if-no-files-found: error
          retention-days: 7
      - name: Remove temporary credentials
        if: always()
        run: rm -f -- "$RUNNER_TEMP/benchmark-private-fixtures.json" "$RUNNER_TEMP/benchmark-private-metrics.json" "$RUNNER_TEMP/generator-network.json"

  aggregate-benchmark:
    needs: [prepare-capacity, distributed-load-test]
    if: always() && needs.prepare-capacity.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: summary-node-*
          path: summaries
          merge-multiple: true
      - name: Aggregate complete run and enforce thresholds
        env:
          EXPECTED_NODES: ${{ needs.prepare-capacity.outputs.nodes }}
        run: node aggregate.mjs
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: always()
        with:
          name: benchmark-result
          path: benchmark-result.json
          if-no-files-found: error
          retention-days: 7
